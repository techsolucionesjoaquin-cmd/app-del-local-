<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 479" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura de KRONOS TECH</title><desc id="desc">Mismo origen para frontend y API. El backend PHP pasa por capas; repositorios acceden a MySQL. Los archivos quedan privados y fiscal es una integración futura.</desc>
