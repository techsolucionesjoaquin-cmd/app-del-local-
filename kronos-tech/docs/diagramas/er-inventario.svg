<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 524" role="img" aria-labelledby="title desc">
<title id="title">ER de inventario</title><desc id="desc">Posición identifica producto y ubicación. Reserva de orden o proyecto se actualiza por eventos; consumo y venta generan movimientos físicos.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 1 L 7.2 4.5 L 0.5 8" fill="none" stroke="#7691a8" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="1039" height="523" rx="16" fill="#f3f7fb" stroke="#c9d9e7"/>
<text x="29" y="30" fill="#58718a" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.5">MODELO ENTIDAD–RELACIÓN  /  EXISTENCIAS Y COMPROMISOS</text>
<path d="M 320 97 H 375" fill="none" stroke="#7691a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 720 97 H 665" fill="none" stroke="#7691a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 520 136 V 218" fill="none" stroke="#7691a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 620 136 V 162 H 865 V 218" fill="none" stroke="#7691a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 320 257 H 375" fill="none" stroke="#7691a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M 520 296 V 365" fill="none" stroke="#7691a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 665 406 H 805 V 296" fill="none" stroke="#7691a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 177 443 V 472 H 930 V 296" fill="none" stroke="#7691a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="34" y="58" width="286" height="78" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="49" y="79" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">PRODUCTO</text><text x="49" y="104" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">products</text><text x="49" y="123" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">SKU y catálogo comercial</text><rect x="375" y="58" width="290" height="78" rx="12" fill="#ebf8f5" stroke="#72b4a9"/><text x="390" y="79" fill="#076d63" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">PK PRODUCTO + UBICACIÓN</text><text x="390" y="104" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">inventory_balances</text><text x="390" y="123" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Físico y reservado por posición</text><rect x="720" y="58" width="286" height="78" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="735" y="79" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">UBICACIÓN</text><text x="735" y="104" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">locations</text><text x="735" y="123" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Ubicaciones en la sucursal</text><rect x="34" y="218" width="286" height="78" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="49" y="239" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">ORIGEN DEL COMPROMISO</text><text x="49" y="264" fill="#142b44" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Ítem de orden o de armado</text><text x="49" y="283" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Destino exclusivo, mismo producto</text><rect x="375" y="218" width="290" height="78" rx="12" fill="#edf4ff" stroke="#9bbadb"/><text x="390" y="239" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">RESERVA</text><text x="390" y="264" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">stock_reservations</text><text x="390" y="283" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Activa · liberada · consumida</text><rect x="720" y="218" width="286" height="78" rx="12" fill="#ebf8f5" stroke="#72b4a9"/><text x="735" y="239" fill="#076d63" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">MAYOR DE EXISTENCIAS</text><text x="735" y="264" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">stock_movements</text><text x="735" y="283" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Delta físico firmado y referencia</text><rect x="34" y="365" width="286" height="78" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="49" y="386" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">VENTA POS</text><text x="49" y="411" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">sale_items</text><text x="49" y="430" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Salida solo para líneas de producto</text><rect x="375" y="365" width="290" height="78" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="390" y="386" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">EVENTOS INMUTABLES</text><text x="390" y="411" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">stock_reservation_events</text><text x="390" y="430" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Creación, liberación o consumo</text>
<rect x="324.0" y="74" width="46" height="21" rx="7" fill="#ffffff" stroke="#c9d9e7"/><text x="347" y="88" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1 : N</text><rect x="670.0" y="74" width="46" height="21" rx="7" fill="#ffffff" stroke="#c9d9e7"/><text x="693" y="88" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1 : N</text><rect x="497.0" y="162" width="46" height="21" rx="7" fill="#ffffff" stroke="#c9d9e7"/><text x="520" y="176" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1 : N</text><rect x="727.0" y="149" width="46" height="21" rx="7" fill="#ffffff" stroke="#c9d9e7"/><text x="750" y="163" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1 : N</text><rect x="324.0" y="233" width="46" height="21" rx="7" fill="#ebf8f5" stroke="#72b4a9"/><text x="347" y="247" fill="#076d63" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1 : N</text><rect x="497.0" y="316" width="46" height="21" rx="7" fill="#ffffff" stroke="#c9d9e7"/><text x="520" y="330" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1 : N</text><rect x="755.5" y="365" width="95" height="21" rx="7" fill="#ffffff" stroke="#c9d9e7"/><text x="803" y="379" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Consumo 1 : 1</text><rect x="417.0" y="459" width="210" height="21" rx="7" fill="#ffffff" stroke="#c9d9e7"/><text x="522" y="473" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Salida POS y reversión vinculada</text>
<text x="29" y="506" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="400" text-anchor="start">Reserva y movimiento no representan lo mismo: solo un movimiento modifica el stock físico.</text>
