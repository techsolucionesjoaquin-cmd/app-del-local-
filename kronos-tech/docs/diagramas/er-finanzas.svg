<rect x="0.5" y="0.5" width="1039" height="499" rx="16" fill="#f3f7fb" stroke="#c9d9e7"/>
<text x="29" y="30" fill="#58718a" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1.5">MODELO ENTIDAD–RELACIÓN  /  CUENTAS, PAGOS Y TURNOS</text>
