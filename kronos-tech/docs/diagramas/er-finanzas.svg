<text x="29" y="482" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="11.8" font-weight="400" text-anchor="start">Los pagos no generan filas espejo en movimientos manuales. El arqueo toma ambos orígenes sin duplicarlos.</text>
