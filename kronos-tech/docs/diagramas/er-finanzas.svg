<rect x="29" y="60" width="321" height="80" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="44" y="81" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">ORIGEN EXCLUYENTE</text><text x="44" y="106" fill="#142b44" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Orden · Armado · Venta</text><text x="44" y="125" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Una cuenta por origen cuando corresponde</text><rect x="393" y="60" width="248" height="80" rx="12" fill="#ebf8f5" stroke="#72b4a9"/><text x="408" y="81" fill="#076d63" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">UN SOLO SALDO POR ORIGEN</text><text x="408" y="106" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">receivables</text><text x="408" y="125" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Cuenta y moneda</text><rect x="697" y="60" width="315" height="80" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="712" y="81" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">VERSIONES DE LA BASE</text><text x="712" y="106" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">receivable_terms</text><text x="712" y="125" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Estimación, base firme o anulación</text><rect x="29" y="224" width="281" height="80" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="44" y="245" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">CAJAS IDENTIFICADAS</text><text x="44" y="270" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">cash_registers</text><text x="44" y="289" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Una caja, turnos históricos</text><rect x="388" y="224" width="260" height="80" rx="12" fill="#edf4ff" stroke="#9bbadb"/><text x="403" y="245" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">TURNO DE CAJA</text><text x="403" y="270" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">cash_sessions</text><text x="403" y="289" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Apertura, responsable y cierre</text><rect x="716" y="224" width="296" height="80" rx="12" fill="#ebf8f5" stroke="#72b4a9"/><text x="731" y="245" fill="#076d63" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">ENLACE CONTABLE</text><text x="731" y="270" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">payment_allocations</text><text x="731" y="289" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Una imputación por pago o devolución</text><rect x="29" y="384" width="296" height="80" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="44" y="405" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">CAJA OPERATIVA</text><text x="44" y="430" fill="#142b44" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Movimientos y arqueos</text><text x="44" y="449" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Manuales y cortes; no duplican pagos</text><rect x="388" y="384" width="260" height="80" rx="12" fill="#edf4ff" stroke="#9bbadb"/><text x="403" y="405" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">ORIGEN DEL FLUJO MONETARIO</text><text x="403" y="430" fill="#142b44" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" text-anchor="start">payments</text><text x="403" y="449" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Cobro o devolución · medio · importe</text><rect x="716" y="384" width="296" height="80" rx="12" fill="#ffffff" stroke="#c9d9e7"/><text x="731" y="405" fill="#25568f" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" text-anchor="start" letter-spacing="1">REGLA DE CONCILIACIÓN</text><text x="731" y="430" fill="#142b44" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">Efectivo neto en caja</text><text x="731" y="449" fill="#455f78" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" text-anchor="start">Débito y transferencia se informan aparte</text>
