<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">ER de cuentas, pagos y caja</title><desc id="desc">Cuenta por orden, proyecto o venta. Cada pago se imputa una vez a la cuenta y se asocia al turno; cortes y movimientos manuales van al turno de manera independiente.</desc>
